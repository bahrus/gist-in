<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gist-in — gist-in-method=setHTMLUnsafe keeps real &lt;option&gt; elements</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc src="gist-in/emc.json"></script>
    </be-hive>

    <!--
      Same fixture as the "known limitation" test, but with
      gist-in-method=setHTMLUnsafe — the escape hatch for exactly that
      limitation, named after (and gated the same as) pipe-in's own *Unsafe
      methods. setHTMLUnsafe never executes scripts either way (that's not
      what "unsafe" buys you here — verified: parses, doesn't sanitize, still
      never runs <script>). Same-origin URL, so the trust gate passes.
    -->
    <select id="sel">
    <?marker name="options">
    </select>

    <template gist-in="/tests/fixtures/real-options.html"
              gist-in-for="options"
              gist-in-method="setHTMLUnsafe"></template>

    <div id=target></div>
    <script>
        setTimeout(() => {
            const opts = document.querySelectorAll('#sel option');
            const templateGone = !document.querySelector('template[gist-in]');
            if (opts.length === 2 && opts[0].value === 'a' && opts[1].value === 'b' && templateGone) {
                target.setAttribute('mark', 'good');
            }
        }, 1500);
    </script>
</body>
</html>
