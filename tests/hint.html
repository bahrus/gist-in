<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>gist-in — gist-in-for-hint scoping</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc src="gist-in/emc.json"></script>
    </be-hive>

    <!-- two markers with the same name; the hint must scope the patch to #scopeB only -->
    <div id="scopeA"><?marker name="thing"></div>
    <div id="scopeB"><?marker name="thing"></div>

    <template gist-in="/tests/fixtures/other.html" gist-in-for="thing" gist-in-for-hint="#scopeB"></template>

    <div id=target></div>
    <script>
        setTimeout(() => {
            const aUntouched = document.querySelector('#scopeA b') === null;
            const bPatched = document.querySelector('#scopeB b')?.textContent === 'patched';
            if (aUntouched && bPatched) target.setAttribute('mark', 'good');
        }, 1500);
    </script>
</body>
</html>
