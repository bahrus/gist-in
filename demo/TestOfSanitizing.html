<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test of Sanitizing</title>
</head>
<body>
    <select id="select">

    </select>
    <script>
        select.setHTML(`
            <option value="1">Option 1</option>
            <option value="2">Option 2</option>
    `, {
            sanitizer: {
                elements: ['option']
            }
        });
    </script>
</body>
</html>
